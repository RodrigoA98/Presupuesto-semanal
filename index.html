<title>Mi Semana</title>
<style>
:root{--bg:#fff;--c:#FAFAFC;--t:#0B1020;--m:#6A7085;--l:#E6E8EE;--a:#3B4EF0;--ai:#fff;--tk:#EEF0F6;--hl:#D9DEEA;--ia:#0B1020;--ii:#8C97B0;--bad:#D6402C;--ok:#1F8F68;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#080B16;--c:#0F1322;--t:#EEF0FA;--m:#7C84A3;--l:#1E2438;--ai:#080B16;--tk:#03050E;--hl:#2F3556;--ia:#fff;--ii:#8A93AE;--bad:#F2705C;--ok:#4FC39C;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10;transition:background-color .2s ease-out}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.4}
body,.card,.tab,input,.ct,.hl,svg{transition:background-color .2s ease-out,color .2s ease-out,border-color .2s ease-out,stroke .2s ease-out}
main{max-width:560px;margin:0 auto;padding:18px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:20px;font-weight:600;margin:0}
.sub{color:var(--m);margin:2px 0 14px}
button{font:inherit;color:inherit;cursor:pointer}
.ct{position:relative;display:block;border:0;padding:0;flex:none;height:38px;border-radius:19px;background:var(--tk);outline:none}
.ct:focus-visible,.tab:focus-visible,.pb:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.ct svg{display:block;width:20px;height:20px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#bp{width:38px}#bp svg{position:absolute;left:9px;top:9px;stroke:var(--ia)}#bp.open{background:var(--hl)}
#tg{width:80px}
#tg .hl{position:absolute;left:4px;top:4px;width:36px;height:30px;border-radius:15px;background:var(--hl);transition:transform .28s cubic-bezier(.3,1.2,.5,1),background-color .2s}
:root[data-theme="dark"] #tg .hl{transform:translateX(36px)}
#tg svg{position:absolute;top:9px}
#su{left:12px;stroke:var(--ia)}#mo{left:48px;stroke:var(--ii)}
:root[data-theme="dark"] #su{stroke:var(--ii)}:root[data-theme="dark"] #mo{stroke:var(--ia)}
#pal{max-height:0;opacity:0;overflow:hidden;transition:max-height .22s ease-out,opacity .18s ease-out,margin .22s ease-out}
#pal.open{max-height:140px;opacity:1;margin-bottom:12px}
#sws{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;justify-items:center;background:var(--c);border-radius:12px;padding:14px}
.sw{width:34px;height:34px;border-radius:50%;border:0;padding:0;transition:transform .15s ease-out,background-color .2s}
.sw.on{transform:scale(1.18)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:7px 2px;text-align:center;font-size:12px;line-height:1.25;border-radius:8px;border:.5px solid var(--l);background:transparent}
.tab b{display:block;font-size:13px;font-weight:600}
.tab.on{background:var(--a);color:var(--ai);border-color:var(--a)}
.tab.now:not(.on){border-color:var(--a)}
.card{background:var(--c);border:.5px solid var(--l);border-radius:12px;padding:14px;margin-bottom:10px}
.lbl{color:var(--m);font-size:13px}
.big{font-size:34px;letter-spacing:-.02em;line-height:1.15;margin:2px 0}
.big.neg{color:var(--bad)}
.bar{height:6px;border-radius:4px;background:var(--l);margin:10px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--a);transition:width .5s ease-out,background-color .2s}
.bar i.over{background:var(--bad)}
.st{display:flex;justify-content:space-between;color:var(--m);font-size:13px}
.note{font-size:13px;margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--m);flex:1;min-width:0}
input{font:inherit;font-size:16px;color:var(--t);background:var(--bg);border:.5px solid var(--l);border-radius:8px;padding:9px;width:100%;min-width:0;min-height:42px;-webkit-appearance:none;appearance:none;text-align:left}
.pb{border:0;border-radius:8px;background:var(--a);color:var(--ai);font-weight:600;padding:0 14px;min-height:42px;transition:background-color .2s,transform .1s}
.pb:active{transform:scale(.97)}
.gh{border:.5px solid var(--l);background:transparent;border-radius:8px;padding:9px 14px}
.warn{color:var(--bad);font-size:13px;margin:8px 0 0}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:.5px solid var(--l);animation:in .25s ease-out}
li:first-child{border-top:0}
li .d{flex:1;min-width:0}li .d span{display:block;color:var(--m);font-size:12px}
li .m{font-weight:600}
li button{border:0;background:transparent;color:var(--m);padding:6px}
.empty{color:var(--m);margin:6px 0 0}
summary{cursor:pointer;font-weight:600}
.sum{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.sum td,.sum th{padding:6px 2px;text-align:right;border-top:.5px solid var(--l)}
.sum th:first-child,.sum td:first-child{text-align:left}.sum th{color:var(--m);font-weight:400}
.fx{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<div class="top">
  <h1>Mi Semana</h1>
  <div class="top" style="gap:8px">
    <button id="bp" class="ct" aria-label="Color de botones" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 1 9-9c0 2.5-2 3.5-4 3.5h-2a2 2 0 0 0-1.4 3.4c.6.6.3 2.1-1.6 2.1z"/><circle cx="7.5" cy="11" r="1" style="fill:var(--ia)"/><circle cx="10.5" cy="7" r="1" style="fill:var(--ia)"/><circle cx="15.5" cy="7.5" r="1" style="fill:var(--ia)"/></svg></button>
    <button id="tg" class="ct" role="switch" aria-checked="false" aria-label="Modo oscuro"><span class="hl"></span>
      <svg id="su" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2.5 12H5M19 12h2.5M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      <svg id="mo" viewBox="0 0 24 24"><path d="M20 14.2A8.5 8.5 0 1 1 9.8 4a6.8 6.8 0 0 0 10.2 10.2z"/></svg></button>
  </div>
</div>
<p class="sub" id="periodo"></p>
<div id="pal"><div id="sws"></div></div>

<div id="semanas" class="tabs"></div>
<div id="resumen" class="card"></div>

<div class="card">
  <div class="row">
    <label>Monto ($)<input id="monto" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"></label>
    <label>Fecha<input id="fecha" type="date"></label>
  </div>
  <div class="row" style="margin-top:8px;align-items:flex-end">
    <label style="flex:2">Detalle (opcional)<input id="det" type="text" maxlength="60" placeholder="Supermercado, nafta..."></label>
    <button class="pb" id="add">Agregar gasto</button>
  </div>
  <p class="warn" id="err" hidden></p>
</div>

<div class="card"><b id="ltit">Gastos</b><ul id="lista"></ul></div>

<div class="card"><details><summary>Resumen del mes</summary><table class="sum" id="tabla"></table></details></div>

<div class="card"><details><summary>Configuración</summary>
  <div class="row" style="margin-top:12px">
    <label>Presupuesto por semana ($)<input id="base" type="text" inputmode="decimal" autocomplete="off"></label>
    <label>Primer día del período<input id="inicio" type="date"></label>
  </div>
  <p class="lbl" id="cfgmsg" style="margin:8px 0 12px"></p>
  <button class="gh" id="nuevo">Empezar nuevo mes</button>
</details></div>
</main>

<script>
var KEY="presupuesto-semanal-v1",W=4,DAY=864e5;
var LC=["#3B4EF0","#1F9D6E","#7C3AED","#E2553D","#0E8FA3","#D6336C","#DB6B00","#1F2937"],
    DC=["#7C8BFF","#4FC39C","#B08CFF","#FF8A72","#4CD6E6","#F472B6","#FFB454","#E5E7EB"];
var S={base:76400,inicio:"2026-11-09",gastos:[],theme:null,color:0,sel:null,confirmar:false};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&o.base!=null)S=Object.assign(S,o)}}catch(e){}
S.confirmar=false;S.sel=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify({base:S.base,inicio:S.inicio,gastos:S.gastos,theme:S.theme,color:S.color}))}catch(e){}}
function $(i){return document.getElementById(i)}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function iso(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd}
function addD(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function $$(n){var r=Math.round(n*100)/100;return "$"+r.toLocaleString("es-AR",Number.isInteger(r)?{maximumFractionDigits:0}:{minimumFractionDigits:2,maximumFractionDigits:2})}
function parseMonto(s){var n=parseFloat(String(s).replace(/\./g,"").replace(",","."));return isNaN(n)?0:Math.round(n*100)/100}
function fmtInput(s){s=String(s).replace(/[^\d,]/g,"");var i=s.indexOf(","),e=i<0?s:s.slice(0,i),d=i<0?null:s.slice(i+1).replace(/,/g,"").slice(0,2);
  e=e.replace(/^0+(?=\d)/,"").replace(/\B(?=(\d{3})+(?!\d))/g,".");return d===null?e:(e||"0")+","+d}
function fd(d){return d.toLocaleDateString("es-AR",{day:"numeric",month:"short"})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hoy(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function anim(el){el.classList.remove("fx");void el.offsetWidth;el.classList.add("fx")}

var mq=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):{matches:false};
function isDark(){return S.theme?S.theme==="dark":mq.matches}
function theme(){var d=isDark(),r=document.documentElement;r.dataset.theme=d?"dark":"light";
  r.style.setProperty("--a",(d?DC:LC)[S.color]||LC[0]);$("tg").setAttribute("aria-checked",d);
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=d?"#080B16":"#ffffff";
  var s=document.querySelectorAll(".sw");for(var k=0;k<s.length;k++){s[k].style.background=(d?DC:LC)[k];s[k].className="sw"+(k==S.color?" on":"")}}
$("sws").innerHTML=LC.map(function(c,k){return '<button class="sw" data-c="'+k+'" aria-label="Color '+(k+1)+'"></button>'}).join("");
$("sws").addEventListener("click",function(e){var b=e.target.closest("[data-c]");if(b){S.color=+b.dataset.c;save();theme()}});
$("tg").onclick=function(){S.theme=isDark()?"light":"dark";save();theme()};
$("bp").onclick=function(){var o=!$("pal").classList.contains("open");$("pal").classList.toggle("open",o);this.classList.toggle("open",o);this.setAttribute("aria-expanded",o)};
if(mq.addEventListener)mq.addEventListener("change",function(){if(!S.theme)theme()});

function weekOf(ds){var i=Math.floor((pd(ds)-pd(S.inicio))/DAY/7);return(i>=0&&i<W)?i:-1}
function calc(){var st=pd(S.inicio),res=[],carry=0,t=hoy();
  for(var i=0;i<W;i++){var ini=addD(st,i*7),fin=addD(ini,6),g=0;
    S.gastos.forEach(function(x){if(weekOf(x.fecha)===i)g+=x.monto});
    g=Math.round(g*100)/100;var disp=S.base+carry,rest=Math.round((disp-g)*100)/100;
    res.push({i:i,ini:ini,fin:fin,carry:carry,disp:disp,gastado:g,rest:rest,actual:t>=ini&&t<=fin,cerrada:t>fin});carry=rest}
  return res}
function actualIdx(r){var t=hoy();if(t<pd(S.inicio))return 0;for(var i=0;i<W;i++)if(r[i].actual)return i;return W-1}

function render(){
  var r=calc();if(S.sel==null||S.sel>=W)S.sel=actualIdx(r);var w=r[S.sel];
  $("periodo").textContent="Del "+fd(r[0].ini)+" al "+fd(r[W-1].fin)+" · "+$$(S.base)+" por semana";
  $("semanas").innerHTML=r.map(function(x){return '<button class="tab'+(x.i===S.sel?' on':'')+(x.actual?' now':'')+'" data-w="'+x.i+'">Sem '+(x.i+1)+'<b>'+fd(x.ini)+'</b></button>'}).join("");
  var pct=w.disp>0?Math.min(100,Math.max(0,w.gastado/w.disp*100)):(w.gastado>0?100:0),over=w.rest<0,nota="";
  if(w.i>0){var c=w.carry;nota=c>0?"Sobraron "+$$(c)+" de la semana anterior y se sumaron a esta.":c<0?"Te pasaste "+$$(-c)+" la semana anterior y se restaron de esta.":"La semana anterior cerró justo en cero.";
    if(!r[w.i-1].cerrada)nota+=" Es una proyección: se confirma el lunes "+fd(w.ini)+"."}
  var dr=w.actual?Math.round((w.fin-hoy())/DAY)+1:0;
  var pdia=(w.actual&&w.rest>0)?'<div class="note">Podés gastar unos '+$$(Math.round(w.rest/dr))+' por día hasta el '+fd(w.fin)+'.</div>':'';
  var rs=$("resumen"),bar=rs.querySelector(".bar i"),prev=bar?bar.style.width:null;
  rs.innerHTML='<div class="lbl">'+(over?'Te pasaste esta semana por':'Te queda esta semana')+'</div><div class="big'+(over?' neg':'')+'">'+$$(Math.abs(w.rest))+'</div>'+
    '<div class="bar"><i class="'+(over?'over':'')+'" style="width:'+(prev||"0%")+'"></i></div>'+
    '<div class="st"><span>Disponible '+$$(w.disp)+'</span><span>Gastado '+$$(w.gastado)+'</span></div>'+(nota?'<div class="note">'+nota+'</div>':'')+pdia;
  var nb=rs.querySelector(".bar i");requestAnimationFrame(function(){requestAnimationFrame(function(){nb.style.width=pct+"%"})});
  var lst=S.gastos.filter(function(g){return weekOf(g.fecha)===S.sel}).sort(function(a,b){return a.fecha<b.fecha?1:-1});
  $("ltit").textContent="Gastos de la semana "+(S.sel+1);
  $("lista").innerHTML=lst.length?lst.map(function(g){return '<li><div class="d">'+esc(g.nota||"Sin detalle")+'<span>'+fd(pd(g.fecha))+'</span></div><div class="m">'+$$(g.monto)+'</div><button data-del="'+g.id+'" aria-label="Borrar gasto">Borrar</button></li>'}).join(""):'<p class="empty">Todavía no cargaste gastos en esta semana.</p>';
  var fuera=S.gastos.filter(function(g){return weekOf(g.fecha)<0}).length;
  $("tabla").innerHTML='<tr><th>Semana</th><th>Disponible</th><th>Gastado</th><th>Resto</th></tr>'+r.map(function(x){return '<tr><td>'+(x.i+1)+'</td><td>'+$$(x.disp)+'</td><td>'+$$(x.gastado)+'</td><td style="color:'+(x.rest<0?'var(--bad)':'var(--ok)')+'">'+$$(x.rest)+'</td></tr>'}).join("")+(fuera?'<tr><td colspan="4" style="color:var(--bad)">'+fuera+' gasto(s) fuera del período no se cuentan.</td></tr>':'');
  $("cfgmsg").textContent=pd(S.inicio).getDay()===1?"El período arranca un lunes: el saldo se actualiza cada lunes.":"Ojo: esa fecha no es lunes. Las semanas se cuentan desde ese día.";
  $("nuevo").textContent=S.confirmar?"Confirmar: borra todos los gastos":"Empezar nuevo mes";
}
$("semanas").addEventListener("click",function(e){var b=e.target.closest("[data-w]");if(b){S.sel=+b.dataset.w;render();anim($("resumen"));anim($("lista"))}});
$("lista").addEventListener("click",function(e){var b=e.target.closest("[data-del]");if(!b)return;S.gastos=S.gastos.filter(function(g){return String(g.id)!==b.dataset.del});save();render()});
$("monto").addEventListener("input",function(){this.value=fmtInput(this.value)});
$("base").addEventListener("input",function(){this.value=fmtInput(this.value);S.base=parseMonto(this.value);save();render()});
$("inicio").addEventListener("change",function(){if(this.value){S.inicio=this.value;S.sel=null;save();render()}});
$("add").addEventListener("click",function(){
  var m=parseMonto($("monto").value),f=$("fecha").value,er=$("err");er.hidden=true;
  if(!(m>0)){er.textContent="Ingresá un monto mayor a cero.";er.hidden=false;return}
  if(!f){er.textContent="Elegí la fecha del gasto.";er.hidden=false;return}
  var wi=weekOf(f);if(wi<0){er.textContent="Esa fecha está fuera del período ("+fd(pd(S.inicio))+" al "+fd(addD(pd(S.inicio),W*7-1))+").";er.hidden=false;return}
  S.gastos.push({id:Date.now()+Math.random().toString(36).slice(2,6),fecha:f,monto:m,nota:$("det").value.trim()});
  save();S.sel=wi;$("monto").value="";$("det").value="";render();$("monto").focus()});
$("nuevo").addEventListener("click",function(){if(!S.confirmar){S.confirmar=true;render();return}S.gastos=[];S.confirmar=false;save();render()});
$("base").value=fmtInput(String(S.base).replace(".",","));$("inicio").value=S.inicio;
(function(){var t=hoy(),st=pd(S.inicio),en=addD(st,W*7-1);$("fecha").value=iso(t<st?st:(t>en?en:t))})();
theme();render();
</script>
</body>
</html>
